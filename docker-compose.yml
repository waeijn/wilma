version: "3.9"

services:
  # ==============================
  # BACKEND SERVICES
  # ==============================
  wilma-api:
    build: ./wilma-backend
    container_name: wilma-api-server
    ports:
      - "8082:80"
    volumes:
      - ./wilma-backend/src:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      - wilma-db
    restart: unless-stopped

  wilma-db:
    image: mysql:8.0
    container_name: wilma-mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wilma_db
      MYSQL_USER: wilma_user
      MYSQL_PASSWORD: wilma_pass
    ports:
      - "3307:3306"
    volumes:
      - wilma_db_data:/var/lib/mysql

  wilma-pma:
    image: phpmyadmin/phpmyadmin
    container_name: wilma-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: wilma-db
      MYSQL_ROOT_PASSWORD: root

  # ==============================
  # FRONTEND SERVICES
  # ==============================
  wilma-frontend:
    image: node:20-alpine
    container_name: wilma-react-frontend
    working_dir: /app
    volumes:
      - ./wilma-frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - FAST_REFRESH=true
    command: sh -c "npm install --legacy-peer-deps && npm start"
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      - wilma-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  wilma_db_data:
  node_modules:
  vendor:
