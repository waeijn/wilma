services:
  forecast-api:
    build: .
    container_name: forecast-api-server
    ports:
      - "8082:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - forecast-db

  forecast-db:
    image: mysql:8.0
    container_name: forecast-mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: forecast_db
      MYSQL_USER: forecast_user
      MYSQL_PASSWORD: forecast_pass
    ports:
      - "3307:3306"
    volumes:
      - forecast_db_data:/var/lib/mysql

  forecast-pma:
    image: phpmyadmin/phpmyadmin
    container_name: forecast-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: forecast-db
      MYSQL_ROOT_PASSWORD: root

volumes:
  forecast_db_data:
